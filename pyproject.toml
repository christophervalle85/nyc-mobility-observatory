[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "nyc-mobility-observatory"
version = "0.1.0"
description = "Reproducible local NYC taxi and subway ingestion"
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb==1.4.3"]

[project.scripts]
mobility = "nyc_mobility.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_mobility"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
